[package]
name = "hora-platform"
description = "Windows-Anbindung: Anmeldeinformationen, Tray, Autostart, Single-Instance, Benachrichtigungen, App-Zeiten"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
hora-i18n.workspace = true
keyring-core.workspace = true
thiserror.workspace = true

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store.workspace = true
windows = { workspace = true, features = [
    "Foundation",
    "Data_Xml_Dom",
    "UI_Notifications",
    "Win32_System_Com",
] }
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Für den Messtest (examples/activity-probe.rs)
[dev-dependencies]
hora-core.workspace = true
chrono.workspace = true
