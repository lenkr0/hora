name: Release

# Ein Tag "v1.2.3" baut den Installer, testet ihn und legt ein GitHub-Release
# mit Installer und SHA-256-Prüfsumme an. Von Hand gestartet entsteht nur das
# Artefakt (zum Ausprobieren), kein Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  installer:
    name: Installer bauen, testen, veröffentlichen
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust stable
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Version aus Cargo.toml, passend zum Tag
        run: |
          $version = [regex]::Match((Get-Content Cargo.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw "Tag $env:GITHUB_REF_NAME passt nicht zur Version $version in Cargo.toml"
          }
          "VERSION=$version" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Tests
        run: cargo test --workspace --locked

      - name: NSIS
        run: |
          $have = (Get-Command makensis -ErrorAction SilentlyContinue) -or (Test-Path "${env:ProgramFiles(x86)}\NSIS\makensis.exe")
          if (-not $have) { choco install nsis -y --no-progress }

      - name: Installer bauen
        run: powershell -ExecutionPolicy Bypass -File tools\build-installer.ps1 -OutDir "$env:GITHUB_WORKSPACE\dist"

      - name: Installer testen (still installieren, starten, deinstallieren)
        run: powershell -ExecutionPolicy Bypass -File tools\installer-test.ps1 -Setup "dist\Hora-Setup-$env:VERSION.exe"

      - name: Prüfsumme
        run: |
          $file = "Hora-Setup-$env:VERSION.exe"
          $hash = (Get-FileHash "dist\$file" -Algorithm SHA256).Hash.ToLower()
          "$hash  $file" | Out-File -Encoding ascii "dist\$file.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: Hora-Setup-${{ env.VERSION }}
          path: dist/*

      - name: Versionshinweise aus CHANGELOG.md
        if: github.ref_type == 'tag'
        run: |
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## \[$([regex]::Escape($env:VERSION))\][^\n]*\n(.*?)(?=^## \[|\z)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { "Hora $env:VERSION" }
          $notes | Out-File -Encoding utf8 notes.md

      - name: GitHub-Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # PowerShell gibt dist/* nicht aufgelöst weiter: Dateien einzeln nennen
          $files = (Get-ChildItem dist -File).FullName
          gh release create $env:GITHUB_REF_NAME @files --title "Hora $env:VERSION" --notes-file notes.md
